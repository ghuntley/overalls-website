name: newsletter-probe
on:
  workflow_dispatch:
    inputs:
      email:
        description: Address to sign up
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ghuntley.com members API from a GitHub runner
        env:
          EMAIL: ${{ inputs.email }}
        run: |
          echo "::add-mask::$EMAIL"
          O="Origin: https://overalls.dev"
          echo "### egress"; curl -sS https://api.ipify.org; echo
          echo "### GET integrity-token"
          curl -sS -D - -o tok.txt -H "$O" https://ghuntley.com/members/api/integrity-token/; echo; echo "token bytes: $(wc -c < tok.txt)"
          echo "### OPTIONS send-magic-link"
          curl -sS -D - -o /dev/null -X OPTIONS -H "$O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://ghuntley.com/members/api/send-magic-link/
          echo "### POST send-magic-link (invalid address a@b)"
          curl -sS -D - -H "$O" -H "Content-Type: application/json" -d "{\"email\":\"a@b\",\"emailType\":\"signup\",\"integrityToken\":\"$(cat tok.txt)\"}" https://ghuntley.com/members/api/send-magic-link/; echo
          echo "### GET integrity-token (fresh, for real signup)"
          curl -sS -o tok2.txt -H "$O" https://ghuntley.com/members/api/integrity-token/
          echo "### POST send-magic-link (real address)"
          curl -sS -D - -H "$O" -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"emailType\":\"signup\",\"integrityToken\":\"$(cat tok2.txt)\"}" https://ghuntley.com/members/api/send-magic-link/; echo
